$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: used_car_model
description: Train RandomForest model on prepared used car data
code: ../../../data-science/src           # folder with train.py
inputs:
  train_data:
    type: uri_folder
  test_data:
    type: uri_folder
  n_estimators:
    type: integer
    default: 100
  max_depth:
    type: integer
    default: 5
outputs:
  model_output:
    type: mlflow_model
command: >-
  python train.py
  --train_data ${{inputs.train_data}}
  --test_data ${{inputs.test_data}}
  --n_estimators ${{inputs.n_estimators}}
  --max_depth ${{inputs.max_depth}}
  --model_output ${{outputs.model_output}}
environment: azureml:used-cars-train@latest
