$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

display_name: used_car_analysis_model
experiment_name: random_forest_training_pipeline
description: Pipeline for data preparation, training, hyperparameter sweep, and model registration

# -------------------------
# Pipeline-level inputs
# -------------------------
inputs:
  input_data_uri:
    type: uri_file
  test_train_ratio:
    type: number
    default: 0.2

# (Optional: if your train.yml uses them as fixed/base params, keep them.
# If not used, you can remove these two.)
  n_estimators:
    type: number
    default: 100
  max_depth:
    type: number
    default: 5

# -------------------------
# Pipeline-level outputs
# -------------------------
outputs:
  pipeline_job_train_data:
    type: uri_folder
    mode: rw_mount
  pipeline_job_test_data:
    type: uri_folder
    mode: rw_mount
  pipeline_job_best_model:
    type: mlflow_model
    mode: rw_mount

# -------------------------
# Global settings
# -------------------------
settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:cpu-cluster1
  continue_on_step_failure: false

# -------------------------
# Jobs in the pipeline
# -------------------------
jobs:

  ########################################
  # 1. Data preparation (prep.py)
  ########################################
  prep_data:
    type: command
    name: data_preparation
    display_name: Data preparation for training
    code: ../../../data-science/src       # folder containing prep.py
    environment: azureml:used_car_analysis@latest
    command: >-
      python prep.py
      --data ${{inputs.data}}
      --test_train_ratio ${{inputs.test_train_ratio}}
      --train_data ${{outputs.train_data}}
      --test_data ${{outputs.test_data}}
    inputs:
      # This maps pipeline input -> job input
      data: ${{parent.inputs.input_data_uri}}
      test_train_ratio: ${{parent.inputs.test_train_ratio}}
    outputs:
      # These map job outputs -> pipeline outputs
      train_data: ${{parent.outputs.pipeline_job_train_data}}
      test_data: ${{parent.outputs.pipeline_job_test_data}}

  ########################################
  # 2. Hyperparameter sweep (uses train.yml)
  ########################################
  sweep_step:
    type: sweep
    name: sweep_job
    display_name: sweep_job
    inputs:
      train_data: ${{parent.jobs.prep_data.outputs.train_data}}
      test_data: ${{parent.jobs.prep_data.outputs.test_data}}
    outputs:
      # Best model from the sweep, exposed at pipeline level
      model_output: ${{parent.outputs.pipeline_job_best_model}}
    sampling_algorithm: random

    # This points to your training command component definition
    trial: ./train.yml

    search_space:
      n_estimators:
        type: choice
        values: [10, 20, 30, 50]
      max_depth:
        type: choice
        values: [3, 5, 10, 15]

    objective:
      goal: minimize
      primary_metric: MSE

    limits:
      max_total_trials: 20
      max_concurrent_trials: 10
      timeout: 7200

  ########################################
  # 3. Model registration (register.py)
  ########################################
  register_model:
    type: command
    name: register_model
    display_name: register_model
    code: ../../../data-science/src       # folder containing register.py
    environment: azureml:used_car_analysis@latest
    command: >-
      python register.py
      --model ${{inputs.model}}
    inputs:
      # Path to the best model (MLflow model dir) from sweep_step
      model: ${{parent.jobs.sweep_step.outputs.model_output}}
